```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Management System - Complaints</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 12px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
            margin: 5px;
        }

        nav {
            margin-top: 5px;
        }

        nav button {
            padding: 6px 12px;
            margin: 3px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .container {
            width: 400px;
            margin: 20px auto;
            background-color: white;
            padding: 18px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin: 5px 0 15px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }

        textarea {
            height: 75px;
            resize: none;
        }

        .submit-btn {
            padding: 7px 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
        }

        .submit-btn:hover {
            background-color: darkgreen;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 7px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 9px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: darkred;
        }

        .logout-btn {
            background-color: #e74c3c;
            color: white;
        }
    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Hostel Management System</h1>

        <nav>

            <button onclick="window.location.href='index.html'">
                Home
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </nav>

    </header>


    <div class="container">


        <!-- STUDENT SECTION -->

        <div id="studentSection">

            <h2>Complaint Box</h2>


            <!-- ROOM NUMBER -->

            <label for="roomNumber">
                Room Number
            </label>

            <input type="text" id="roomNumber" placeholder="Enter room number (301-340)">


            <!-- COMPLAINT TYPE -->

            <label for="complaintType">
                Complaint Type
            </label>

            <select id="complaintType">

                <option value="">
                    Select Complaint Type
                </option>

                <option value="Room Maintenance">
                    Room Maintenance
                </option>

                <option value="Water">
                    Water
                </option>

                <option value="Electricity">
                    Electricity
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Cleaning">
                    Cleaning
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- ENTER COMPLAINT -->

            <label for="complaint">
                Enter Complaint
            </label>

            <textarea id="complaint" placeholder="Write your complaint here"></textarea>

            <br>

            <button class="submit-btn" onclick="submitComplaint()">
                Submit Complaint
            </button>

        </div>


        <!-- ADMIN SECTION -->

        <div id="adminSection" style="display:none;">

            <h2>Student Complaints</h2>

            <table>

                <thead>

                    <tr>

                        <th>Room Number</th>

                        <th>Complaint Type</th>

                        <th>Complaint</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="complaintTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>


        // PAGE LOAD

        window.onload = function () {

            let role =
                localStorage.getItem("userRole");


            // STUDENT

            if (role === "Student") {

                document.getElementById("studentSection")
                    .style.display = "block";

                document.getElementById("adminSection")
                    .style.display = "none";

            }


            // ADMIN

            else if (role === "Admin") {

                document.getElementById("studentSection")
                    .style.display = "none";

                document.getElementById("adminSection")
                    .style.display = "block";

                showComplaints();

            }


            // NOT LOGGED IN

            else {

                alert("Please login first.");

                window.location.href = "index.html";

            }

        };


        // STUDENT - SUBMIT COMPLAINT

        function submitComplaint() {

            let roomNumber =
                document.getElementById("roomNumber")
                    .value.trim();


            let complaintType =
                document.getElementById("complaintType")
                    .value;


            let complaint =
                document.getElementById("complaint")
                    .value.trim();


            // ROOM NUMBER EMPTY VALIDATION

            if (roomNumber === "") {

                alert("Please enter room number.");

                return;
            }


            // ROOM NUMBER VALIDATION
            // ONLY 301 TO 340 ARE ALLOWED

            let room = Number(roomNumber);

            if (
                !Number.isInteger(room) ||
                room < 301 ||
                room > 340
            ) {

                alert(
                    "Invalid room number. Please enter a room number between 301 and 340."
                );

                return;
            }


            // COMPLAINT TYPE VALIDATION

            if (complaintType === "") {

                alert("Please select complaint type.");

                return;
            }


            // COMPLAINT VALIDATION

            if (complaint === "") {

                alert("Please enter your complaint.");

                return;
            }


            // CREATE COMPLAINT

            let complaintData = {

                room: roomNumber,

                type: complaintType,

                complaint: complaint

            };


            // GET EXISTING COMPLAINTS

            let complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            // ADD NEW COMPLAINT

            complaints.push(complaintData);


            // SAVE DATA

            localStorage.setItem(
                "complaints",
                JSON.stringify(complaints)
            );


            // SUCCESS MESSAGE

            alert("Complaint submitted successfully!");


            // CLEAR FORM

            document.getElementById("roomNumber").value = "";

            document.getElementById("complaintType").value = "";

            document.getElementById("complaint").value = "";

        }


        // ADMIN - VIEW COMPLAINTS

        function showComplaints() {

            let complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            let table =
                document.getElementById("complaintTable");


            table.innerHTML = "";


            // NO COMPLAINTS

            if (complaints.length === 0) {

                table.innerHTML = `
                    <tr>

                        <td colspan="4">
                            No complaints submitted
                        </td>

                    </tr>
                `;

                return;
            }


            // DISPLAY COMPLAINTS

            complaints.forEach(function (item, index) {

                let row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${item.room || ""}
                    </td>

                    <td>
                        ${item.type || ""}
                    </td>

                    <td>
                        ${item.complaint || ""}
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteComplaint(${index})"
                        >
                            Delete
                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }


        // ADMIN - DELETE COMPLAINT

        function deleteComplaint(index) {

            let complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            // CONFIRM DELETE

            if (
                confirm(
                    "Are you sure you want to delete this complaint?"
                )
            ) {

                // REMOVE SELECTED COMPLAINT

                complaints.splice(index, 1);


                // SAVE UPDATED LIST

                localStorage.setItem(
                    "complaints",
                    JSON.stringify(complaints)
                );


                // REFRESH TABLE

                showComplaints();


                alert("Complaint deleted successfully!");

            }

        }


        // LOGOUT

        function logout() {

            localStorage.removeItem("loggedIn");

            localStorage.removeItem("userRole");

            localStorage.removeItem("studentRoll");


            alert("Logged out successfully!");


            window.location.href = "index.html";

        }

    </script>

</body>

</html>
