<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* NAVIGATION */
        nav {
            background-color: #444;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        /* SMALL LOGOUT BUTTON */
        .logout-btn {
            background-color: red !important;
            color: white !important;
            border: none !important;
            padding: 4px 8px !important;
            font-size: 11px !important;
            border-radius: 3px !important;
            cursor: pointer;
            margin: 0 0 0 2px !important;
            width: auto !important;
            height: auto !important;
            display: inline-block !important;
        }

        .logout-btn:hover {
            background-color: darkred !important;
        }

        .container {
            width: 90%;
            margin: 25px auto;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* ADMIN ROOM AREA */
        .admin-room-area {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        /* ROOM NUMBERS */
        .room-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .room-box {
            background-color: rgb(4, 248, 40);
            border: 1px solid #ccc;
            padding: 18px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: 0.2s;
        }

        .room-box:hover {
            background-color: #e8f0ff;
            transform: translateY(-2px);
        }

        .room-box h3 {
            margin: 0;
            color: #333;
        }

        /* INFO ICON */
        .info-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: #333;
            color: white;
            font-size: 14px;
            line-height: 22px;
            text-align: center;
            font-weight: bold;
        }

        /* ROOM DETAILS */
        .room-details {
            width: 260px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: none;
            position: sticky;
            top: 20px;
        }

        .room-details h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .room-details p {
            font-size: 16px;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .room-details strong {
            color: #333;
        }

        /* AVAILABLE ROOM INFORMATION */
        .availability-note {
            background-color: #fff;
            padding: 12px;
            margin: 15px auto;
            width: 80%;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        /* STUDENT APPLICATION */
        .application-box {
            background-color: white;
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 1, 0, 0.1);
        }

        .application-box input,
        .application-box select {
            width: 100%;
            padding: 9px;
            margin: 8px 0 15px 0;
            box-sizing: border-box;
        }

        .application-box button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .application-box button:hover {
            background-color: #555;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        /* MOBILE */
        @media screen and (max-width: 900px) {

            .admin-room-area {
                flex-direction: column;
            }

            .room-container {
                width: 100%;
                grid-template-columns: repeat(3, 1fr);
            }

            .room-details {
                width: auto;
                position: static;
                margin-top: 20px;
            }
        }

        @media screen and (max-width: 600px) {

            .room-container {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Hostel Management System</h1>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="student.html">Students</a>
        <a href="rooms.html">Rooms</a>
        <a href="complaints.html">Complaints</a>

        <button type="button" class="logout-btn" onclick="logoutUser()">
            Logout
        </button>
    </nav>

    <div class="container">

        <!-- ADMIN SECTION -->
        <div id="adminSection">

            <h2>Room Management</h2>

            <div class="availability-note">
                Click on a room number or <b>ⓘ</b> icon to view room details.
            </div>

            <h2>Room Numbers 301 - 340</h2>

            <!-- ROOM AREA -->
            <div class="admin-room-area">

                <!-- ROOM BOXES -->
                <div class="room-container" id="roomContainer">
                </div>

                <!-- ROOM DETAILS -->
                <div class="room-details" id="roomDetails">

                    <h2>Room Details</h2>

                    <p>
                        <strong>Room Number:</strong>
                        <span id="detailRoomNumber"></span>
                    </p>

                    <p>
                        <strong>Capacity:</strong>
                        <span id="detailCapacity"></span>
                    </p>

                    <p>
                        <strong>Occupied:</strong>
                        <span id="detailOccupied"></span>
                    </p>

                    <p>
                        <strong>Available:</strong>
                        <span id="detailAvailable"></span>
                    </p>

                </div>

            </div>
        </div>

        <!-- STUDENT SECTION -->
        <div id="studentSection">

            <h2>Room Application</h2>

            <div class="application-box">

                <form onsubmit="applyForRoom(event)">

                    <label>Student Name</label>

                    <input type="text" id="applicationStudentName" required>

                    <label>Roll Number</label>

                    <input type="text" id="applicationRollNumber" required>

                    <label>Select Room Number</label>

                    <select id="applicationRoomNumber" required>

                        <option value="">
                            -- Select Available Room --
                        </option>

                    </select>

                    <button type="submit">
                        Apply for Room
                    </button>

                </form>

                <div class="message" id="applicationMessage">
                </div>

            </div>

        </div>

    </div>

    <script>

        /* LOGIN DETAILS */

        let loggedIn = localStorage.getItem("loggedIn");

        let userRole = localStorage.getItem("userRole");


        /* CHECK LOGIN */

        if (loggedIn !== "true") {

            alert("Please login first.");

            window.location.href = "index.html";
        }


        /* SHOW SECTION */

        if (userRole === "Admin") {

            document.getElementById("adminSection").style.display = "block";

            document.getElementById("studentSection").style.display = "none";

            loadAdminRooms();

        }

        else if (userRole === "Student") {

            document.getElementById("adminSection").style.display = "none";

            document.getElementById("studentSection").style.display = "block";

            loadStudentInformation();

            loadRoomOptions();

        }

        else {

            document.getElementById("adminSection").style.display = "none";

            document.getElementById("studentSection").style.display = "block";

            loadRoomOptions();
        }


        /* GET STUDENTS */

        function getStudents() {

            return JSON.parse(
                localStorage.getItem("students") || "[]"
            );
        }


        /* GET ROOM CAPACITY */

        function getRoomCapacity(roomNumber) {

            let extraRooms = JSON.parse(
                localStorage.getItem("extraRooms") || "[]"
            );

            let extraRoom = extraRooms.find(function (room) {

                return String(room.roomNumber).trim() ===
                    String(roomNumber).trim();

            });

            if (extraRoom) {

                return Number(extraRoom.capacity);
            }

            return 4;
        }


        /* GET OCCUPIED COUNT */

        function getOccupiedCount(roomNumber) {

            let students = getStudents();

            return students.filter(function (student) {

                return String(student.roomNumber).trim() ===
                    String(roomNumber).trim();

            }).length;
        }


        /* LOAD ADMIN ROOMS */

        function loadAdminRooms() {

            let container =
                document.getElementById("roomContainer");

            container.innerHTML = "";


            /* ROOMS 301 - 340 */

            for (let room = 301; room <= 340; room++) {

                createRoomBox(room);
            }


            /* EXTRA ROOMS */

            let extraRooms = JSON.parse(
                localStorage.getItem("extraRooms") || "[]"
            );

            extraRooms.forEach(function (room) {

                let alreadyExists =
                    room.roomNumber >= 301 &&
                    room.roomNumber <= 340;

                if (!alreadyExists) {

                    createRoomBox(room.roomNumber);
                }
            });
        }


        /* CREATE ROOM BOX */

        function createRoomBox(roomNumber) {

            let container =
                document.getElementById("roomContainer");

            let box =
                document.createElement("div");

            box.className = "room-box";

            box.onclick = function () {

                showRoomDetails(roomNumber);
            };

            box.innerHTML =
                "<div class='info-icon'>ⓘ</div>" +
                "<h3>Room " +
                roomNumber +
                "</h3>";

            container.appendChild(box);
        }


        /* SHOW ROOM DETAILS BESIDE */

        function showRoomDetails(roomNumber) {

            let capacity =
                getRoomCapacity(roomNumber);

            let occupied =
                getOccupiedCount(roomNumber);

            let available =
                capacity - occupied;

            if (available < 0) {

                available = 0;
            }


            document.getElementById(
                "detailRoomNumber"
            ).textContent = roomNumber;


            document.getElementById(
                "detailCapacity"
            ).textContent = capacity;


            document.getElementById(
                "detailOccupied"
            ).textContent = occupied;


            document.getElementById(
                "detailAvailable"
            ).textContent = available;


            document.getElementById(
                "roomDetails"
            ).style.display = "block";
        }


        /* LOAD STUDENT INFORMATION */

        function loadStudentInformation() {

            let rollNumber =
                localStorage.getItem("studentRoll");

            if (!rollNumber) {

                return;
            }


            let students = getStudents();

            let student =
                students.find(function (item) {

                    return String(item.rollNumber).trim() ===
                        String(rollNumber).trim();

                });


            if (student) {

                document.getElementById(
                    "applicationStudentName"
                ).value = student.name;


                document.getElementById(
                    "applicationRollNumber"
                ).value = student.rollNumber;
            }
        }


        /* LOAD AVAILABLE ROOMS */

        function loadRoomOptions() {

            let select =
                document.getElementById(
                    "applicationRoomNumber"
                );

            select.innerHTML =
                '<option value="">-- Select Available Room --</option>';


            let students = getStudents();


            /* ROOMS 301 - 340 */

            for (let room = 301; room <= 340; room++) {

                let capacity =
                    getRoomCapacity(room);


                let occupied =
                    students.filter(function (student) {

                        return String(student.roomNumber).trim() ===
                            String(room).trim();

                    }).length;


                let available =
                    capacity - occupied;


                let option =
                    document.createElement("option");

                option.value = room;


                if (available > 0) {

                    option.textContent =
                        "Room " +
                        room +
                        " - " +
                        available +
                        " Available";

                    option.disabled = false;

                }

                else {

                    option.textContent =
                        "Room " +
                        room +
                        " - Full";

                    option.disabled = true;
                }


                select.appendChild(option);
            }
        }


        /* APPLY FOR ROOM */

        function applyForRoom(event) {

            event.preventDefault();


            let studentName =
                document.getElementById(
                    "applicationStudentName"
                ).value.trim();


            let rollNumber =
                document.getElementById(
                    "applicationRollNumber"
                ).value.trim();


            let roomNumber =
                document.getElementById(
                    "applicationRoomNumber"
                ).value;


            let message =
                document.getElementById(
                    "applicationMessage"
                );


            if (
                studentName === "" ||
                rollNumber === "" ||
                roomNumber === ""
            ) {

                message.textContent =
                    "Please fill all details.";

                message.style.color = "red";

                return;
            }


            let students = getStudents();


            /* FIND STUDENT */

            let studentIndex =
                students.findIndex(function (student) {

                    return String(student.rollNumber).trim() ===
                        String(rollNumber).trim();

                });


            if (studentIndex === -1) {

                message.textContent =
                    "Student is not registered.";

                message.style.color = "red";

                return;
            }


            /* CHECK EXISTING ROOM */

            if (
                students[studentIndex].roomNumber &&
                students[studentIndex].roomNumber !== ""
            ) {

                message.textContent =
                    "You already have Room " +
                    students[studentIndex].roomNumber;

                message.style.color = "red";

                return;
            }


            /* CHECK CAPACITY */

            let capacity =
                getRoomCapacity(roomNumber);


            let occupied =
                getOccupiedCount(roomNumber);


            if (occupied >= capacity) {

                message.textContent =
                    "Sorry! Room " +
                    roomNumber +
                    " is full.";

                message.style.color = "red";

                loadRoomOptions();

                return;
            }


            /* ALLOCATE ROOM */

            students[studentIndex].roomNumber =
                roomNumber;

            students[studentIndex].name =
                studentName;


            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );


            message.textContent =
                "Room " +
                roomNumber +
                " allocated successfully!";

            message.style.color = "green";


            /* UPDATE AVAILABILITY */

            loadRoomOptions();


            document.getElementById(
                "applicationRoomNumber"
            ).value = "";
        }


        /* LOGOUT */

        function logoutUser() {

            localStorage.removeItem("loggedIn");

            localStorage.removeItem("userRole");

            localStorage.removeItem("studentRoll");

            window.location.href = "index.html";
        }

    </script>

</body>

</html>
