```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Management System - Students</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        nav {
            margin-top: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* SMALL LOGOUT BUTTON */
        .student-logout-btn {
            background-color: #e74c3c !important;
            color: white !important;
            border: none !important;
            padding: 4px 9px !important;
            margin-left: 4px !important;
            font-size: 12px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
            width: auto !important;
        }

        /* MAIN CONTAINER */
        .container {
            width: 90%;
            margin: 20px auto;
        }

        /* SMALL REGISTRATION FORM */
        #registrationSection {
            width: 330px;
            margin: 20px auto;
            padding: 15px;
        }

        .box {
            background-color: white;
            padding: 15px;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.1);
        }

        #registrationSection h2 {
            color: #2c3e50;
            text-align: center;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 6px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }

        .submit-btn {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 4px;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }

        /* SUCCESS MESSAGE */
        #successMessage {
            display: none;
            width: 330px;
            margin: 20px auto;
            background-color: #dff0d8;
            color: #2e7d32;
            text-align: center;
            font-weight: bold;
            padding: 15px;
        }

        /* ADMIN SEARCH */
        #adminSearch {
            display: none;
            width: 90%;
            margin: 10px auto 5px auto;
            text-align: right;
        }

        .search-box {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .search-box input {
            width: 140px;
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 12px;
        }

        .search-box button {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        .search-box button:hover {
            background-color: #2980b9;
        }

        /* SEARCH RESULT */
        #searchResult {
            display: none;
            width: 90%;
            margin: 5px auto 12px auto;
            text-align: right;
        }

        .search-result-box {
            display: inline-block;
            width: 280px;
            background-color: white;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: left;
            font-size: 13px;
        }

        .search-result-box p {
            margin: 5px 0;
        }

        /* ADMIN SECTION */
        #adminSection {
            display: none;
        }

        #adminSection h2 {
            color: #2c3e50;
            text-align: center;
            font-size: 20px;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        table th,
        table td {
            border: 1px solid #ccc;
            padding: 7px;
            text-align: center;
        }

        table th {
            background-color: #34495e;
            color: white;
        }

        table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .no-data {
            text-align: center;
            padding: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>Hostel Management System</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="student.html">Students</a>

            <a href="rooms.html">Rooms</a>

            <a href="complaints.html">Complaints</a>

            <button class="student-logout-btn" onclick="logoutUser()">
                Logout
            </button>

        </nav>

    </header>


    <!-- ADMIN SEARCH -->
    <div id="adminSearch">

        <div class="search-box">

            <input type="text" id="searchRollNumber" placeholder="Roll Number">

            <button onclick="searchStudent()">
                Search
            </button>

        </div>

    </div>


    <!-- SEARCH RESULT -->
    <div id="searchResult"></div>


    <div class="container">

        <!-- STUDENT REGISTRATION -->

        <div class="box" id="registrationSection">

            <h2>Student Registration</h2>

            <form onsubmit="registerStudent(event)">

                <div class="form-group">

                    <label>
                        Student Name
                    </label>

                    <input type="text" id="studentName" required>

                </div>


                <div class="form-group">

                    <label>
                        Roll Number
                    </label>

                    <input type="text" id="rollNumber" required>

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input type="email" id="email" required>

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input type="text" id="phone" required>

                </div>


                <div class="form-group">

                    <label>
                        Branch
                    </label>

                    <input type="text" id="branch" required>

                </div>


                <div class="form-group">

                    <label>
                        Year
                    </label>

                    <select id="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <button type="submit" class="submit-btn">
                    Register
                </button>

            </form>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div class="box" id="successMessage">

            Student Registered Successfully!

        </div>


        <!-- ADMIN SECTION -->

        <div class="box" id="adminSection">

            <h2>
                Registered Student Details
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>S.No</th>

                        <th>Name</th>

                        <th>Roll Number</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Branch</th>

                        <th>Year</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        /* PAGE LOAD */

        window.onload = function () {

            let loggedIn =
                localStorage.getItem("loggedIn");

            let role =
                localStorage.getItem("userRole");


            if (loggedIn !== "true") {

                alert("Please login first!");

                window.location.href =
                    "index.html";

                return;
            }


            /* STUDENT */

            if (role === "Student") {

                document.getElementById(
                    "registrationSection"
                ).style.display = "block";

                document.getElementById(
                    "adminSection"
                ).style.display = "none";

                document.getElementById(
                    "adminSearch"
                ).style.display = "none";

                document.getElementById(
                    "searchResult"
                ).style.display = "none";

                document.getElementById(
                    "successMessage"
                ).style.display = "none";
            }


            /* ADMIN */

            else if (role === "Admin") {

                document.getElementById(
                    "registrationSection"
                ).style.display = "none";

                document.getElementById(
                    "successMessage"
                ).style.display = "none";

                document.getElementById(
                    "adminSearch"
                ).style.display = "block";

                document.getElementById(
                    "adminSection"
                ).style.display = "block";

                showAdminStudents();
            }

        };


        /* REGISTER STUDENT */

        function registerStudent(event) {

            event.preventDefault();


            let name =
                document.getElementById(
                    "studentName"
                ).value.trim();


            let rollNumber =
                document.getElementById(
                    "rollNumber"
                ).value.trim();


            let email =
                document.getElementById(
                    "email"
                ).value.trim();


            let phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            let branch =
                document.getElementById(
                    "branch"
                ).value.trim();


            let year =
                document.getElementById(
                    "year"
                ).value;


            let students =
                JSON.parse(
                    localStorage.getItem(
                        "students"
                    ) || "[]"
                );


            /* DUPLICATE CHECK */

            let alreadyExists =
                students.some(
                    function (student) {

                        return String(
                            student.rollNumber
                        )
                            .trim()
                            .toLowerCase() ===
                            rollNumber.toLowerCase();

                    }
                );


            if (alreadyExists) {

                alert(
                    "This Roll Number is already registered!"
                );

                return;
            }


            /* NEW STUDENT */

            let student = {

                name: name,

                rollNumber: rollNumber,

                email: email,

                phone: phone,

                branch: branch,

                year: year,

                roomNumber: ""

            };


            students.push(student);


            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );


            document
                .querySelector("form")
                .reset();


            document.getElementById(
                "registrationSection"
            ).style.display = "none";


            document.getElementById(
                "successMessage"
            ).style.display = "block";


            alert(
                "Student Registered Successfully!"
            );
        }


        /* ADMIN STUDENT TABLE */

        function showAdminStudents() {

            let students =
                JSON.parse(
                    localStorage.getItem(
                        "students"
                    ) || "[]"
                );


            let tableBody =
                document.getElementById(
                    "studentTableBody"
                );


            tableBody.innerHTML = "";


            if (students.length === 0) {

                tableBody.innerHTML =
                    '<tr>' +
                    '<td colspan="8" class="no-data">' +
                    'No students registered yet.' +
                    '</td>' +
                    '</tr>';

                return;
            }


            students.forEach(
                function (student, index) {

                    let row =
                        document.createElement("tr");


                    row.innerHTML =

                        "<td>" +
                        (index + 1) +
                        "</td>" +

                        "<td>" +
                        student.name +
                        "</td>" +

                        "<td>" +
                        student.rollNumber +
                        "</td>" +

                        "<td>" +
                        student.email +
                        "</td>" +

                        "<td>" +
                        student.phone +
                        "</td>" +

                        "<td>" +
                        student.branch +
                        "</td>" +

                        "<td>" +
                        student.year +
                        "</td>" +

                        "<td>" +

                        '<button class="delete-btn" ' +

                        'onclick="deleteStudent(' +

                        index +

                        ')">' +

                        "Delete" +

                        "</button>" +

                        "</td>";


                    tableBody.appendChild(row);

                }
            );

        }


        /* SEARCH STUDENT */

        function searchStudent() {

            let rollNumber =
                document.getElementById(
                    "searchRollNumber"
                ).value.trim();


            let result =
                document.getElementById(
                    "searchResult"
                );


            result.style.display = "block";


            /* EMPTY SEARCH */

            if (rollNumber === "") {

                result.innerHTML =
                    '<div class="search-result-box">' +

                    '<p><b>Not Available</b></p>' +

                    '</div>';

                return;
            }


            let students =
                JSON.parse(
                    localStorage.getItem(
                        "students"
                    ) || "[]"
                );


            let student =
                students.find(
                    function (item) {

                        return String(
                            item.rollNumber
                        )
                            .trim()
                            .toLowerCase() ===
                            rollNumber.toLowerCase();

                    }
                );


            /* STUDENT NOT FOUND */

            if (!student) {

                result.innerHTML =
                    '<div class="search-result-box">' +

                    '<p><b>Not Available</b></p>' +

                    '</div>';

                return;
            }


            /* SHOW COMPLETE STUDENT DETAILS */

            result.innerHTML =

                '<div class="search-result-box">' +

                '<p><b>Name:</b> ' +
                (student.name || "Not Available") +
                '</p>' +

                '<p><b>Roll Number:</b> ' +
                (student.rollNumber || "Not Available") +
                '</p>' +

                '<p><b>Email:</b> ' +
                (student.email || "Not Available") +
                '</p>' +

                '<p><b>Phone:</b> ' +
                (student.phone || "Not Available") +
                '</p>' +

                '<p><b>Branch:</b> ' +
                (student.branch || "Not Available") +
                '</p>' +

                '<p><b>Year:</b> ' +
                (student.year || "Not Available") +
                '</p>' +

                '<p><b>Room Number:</b> ' +
                (student.roomNumber || "Not Allocated") +
                '</p>' +

                '</div>';

        }


        /* DELETE STUDENT */

        function deleteStudent(index) {

            let confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );


            if (!confirmDelete) {
                return;
            }


            let students =
                JSON.parse(
                    localStorage.getItem(
                        "students"
                    ) || "[]"
                );


            students.splice(index, 1);


            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );


            showAdminStudents();


            document.getElementById(
                "searchResult"
            ).style.display = "none";


            document.getElementById(
                "searchRollNumber"
            ).value = "";


            alert(
                "Student deleted successfully!"
            );

        }


        /* LOGOUT */

        function logoutUser() {

            localStorage.removeItem(
                "loggedIn"
            );

            localStorage.removeItem(
                "userRole"
            );

            localStorage.removeItem(
                "studentRoll"
            );


            window.location.href =
                "index.html";
        }

    </script>

</body>

</html>
